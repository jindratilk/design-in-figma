<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F1 · Mobile – order detail, awaiting payment</title>
<style>
/* Inter 3.19, the version Figma has. Google Fonts serves Inter 4, which sets text 1-2 % narrower. */
@import url('https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/400.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/500.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/600.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/700.css');
:root{--bg:#f3f5f4;--surface:#fff;--ink:#141414;--muted:#6b7370;--line:#e3e7e5;--brand:#0d7a45;--warn:#9a5b00;--warn-soft:#fdf1dc;--danger:#b3261e;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dedb;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:22px;color:var(--ink);-webkit-font-smoothing:antialiased}
.frame{width:390px;min-height:844px;background:var(--bg);display:flex;flex-direction:column}
.bar{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:600}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.h1{font-size:22px;line-height:28px;font-weight:700}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:13px;line-height:18px;font-weight:600}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.note{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row.first{border-top:0;padding-top:0}
.sub{font-size:13px;line-height:18px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px solid var(--line)}
.k{color:var(--muted)}
.amount{font-size:20px;line-height:26px;font-weight:700}
.foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{border-color:transparent;color:var(--danger);height:40px}
</style>
</head>
<body>
<div class="frame">
  <div class="bar" data-name="Top bar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Orders
  </div>
  <div class="body">
    <div class="h1">Order 20418</div>
    <div class="pills"><div class="pill wait">Awaiting payment</div><div class="pill note">Due in 3 days</div></div>
    <div class="card" data-name="Items">
      <div class="row first"><div><div>Tile cutter 900 mm</div><div class="sub num">12 – 18 May 2026</div></div><div class="num">84.00 €</div></div>
      <div class="row"><div><div>Rotary hammer drill</div><div class="sub num">12 – 18 May 2026</div></div><div class="num">56.00 €</div></div>
      <div class="total"><div class="k">Total</div><div class="amount num">140.00 €</div></div>
    </div>
    <div class="card" data-name="Customer">
      <div class="row first"><div class="k">Customer</div><div>Maya Lindqvist</div></div>
      <div class="row"><div class="k">Phone</div><div class="num">+46 70 555 01 42</div></div>
      <div class="row"><div class="k">Internal note</div><div class="k">–</div></div>
    </div>
  </div>
  <div class="foot" data-name="Actions">
    <div class="btn primary">Record payment</div>
    <div class="btn">Send reminder</div>
    <div class="btn danger">Cancel order</div>
  </div>
</div>
</body>
</html>
